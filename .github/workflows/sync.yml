name: Sync library

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync = fetch new posts · reclassify = redo all categories · rebuild = republish only'
        type: choice
        options: [sync, reclassify, rebuild]
        default: sync
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'pipeline/**'
      - 'taxonomy.yml'
      - 'requirements.txt'
      - '.github/workflows/sync.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    env:
      HAS_SECRETS: ${{ secrets.SITE_PASSWORD != '' && secrets.THUMB_SECRET != '' }}
      MODE: ${{ inputs.mode || 'sync' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Check out data branch
        working-directory: app
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git worktree add ../data FETCH_HEAD
            git -C ../data checkout -q -B data
          else
            git worktree add --orphan -b data ../data
          fi

      - uses: actions/setup-python@v5
        if: env.HAS_SECRETS == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install pipeline
        if: env.HAS_SECRETS == 'true'
        run: pip install -q -r app/requirements.txt

      - name: Run pipeline
        id: pipeline
        if: env.HAS_SECRETS == 'true'
        working-directory: app
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_PASSWORD_OLD: ${{ secrets.SITE_PASSWORD_OLD }}
          GUEST_PASSWORDS: ${{ secrets.GUEST_PASSWORDS }}
          THUMB_SECRET: ${{ secrets.THUMB_SECRET }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
          MAX_CLASSIFICATIONS_PER_RUN: ${{ vars.MAX_CLASSIFICATIONS_PER_RUN }}
          TIME_BUDGET_SECONDS: '1200'
        run: python -m pipeline.main "$MODE" --data-dir ../data

      - name: Commit data
        if: steps.pipeline.outputs.changed == 'true'
        working-directory: data
        env:
          NEW: ${{ steps.pipeline.outputs.new_items || 0 }}
          CLS: ${{ steps.pipeline.outputs.classified || 0 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: +${NEW} items, ${CLS} classified"
          git push -q origin data

      - name: Decide whether to deploy
        id: decide
        run: |
          if [ "${{ steps.pipeline.outputs.changed }}" = "true" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.deploy == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Build website
        if: steps.decide.outputs.deploy == 'true'
        working-directory: app/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble site
        if: steps.decide.outputs.deploy == 'true'
        run: |
          mkdir -p site
          cp -r app/web/dist/. site/
          rm -rf site/demo
          if [ -f data/library.enc ]; then
            cp data/library.enc site/
            if [ -d data/thumbs ]; then cp -r data/thumbs site/; fi
          fi
          touch site/.nojekyll

      # Same as actions/upload-pages-artifact, but without listing every file in the log
      # (thousands of thumbnails would bury the pipeline summary).
      - name: Package site
        if: steps.decide.outputs.deploy == 'true'
        run: tar --dereference --hard-dereference -C site -cf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.deploy == 'true'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
